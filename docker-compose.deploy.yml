# Full-stack container run — a local mirror of the hosted deploy, and the reference for Azure.
#   RAZORPAY_WEBHOOK_SECRET=whsec_sentinel docker compose -f docker-compose.deploy.yml up --build
#   open http://localhost:8080
# ML is optional (the API falls back to deterministic scoring); uncomment the `ml` service to enable it.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    volumes:
      - sentinel-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel@db:5432/sentinel?schema=public
      PORT: "8787"
      NODE_ENV: production
      # PUBLIC_URL — your public origin when hosting (e.g. http://<vm-ip> or https://your.domain).
      # Drives CORS (WEB_ORIGIN) and the Razorpay payment-link callback (PUBLIC_BASE_URL). Local default below.
      WEB_ORIGIN: ${PUBLIC_URL:-http://localhost:8080}
      PUBLIC_BASE_URL: ${PUBLIC_URL:-http://localhost:8080}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-whsec_sentinel_local_selftest}
      # Test-mode keys enable real payment links; empty = simulated links (fully functional demo).
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      # ML_SERVICE_URL: http://ml:8899   # uncomment together with the ml service below
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    ports:
      # Local default 8080; set WEB_PORT=80 when hosting so the site answers on the bare public URL.
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

  # Optional ML service (trains at build — a few minutes). The API works without it.
  # ml:
  #   build: ./ml
  #   environment:
  #     SENTINEL_MODELS: /app/artifacts

volumes:
  sentinel-db-data:
