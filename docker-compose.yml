# Local PostgreSQL for Overwatch.
# Start with:  docker compose up -d   (requires Docker Desktop running)
# Then set server/.env DATABASE_URL to the value in server/.env.example.
services:
  db:
    image: postgres:16-alpine
    container_name: sentinel-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports:
      - "5432:5432"
    volumes:
      - sentinel-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sentinel-db-data:
