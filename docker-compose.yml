# Local PostgreSQL for Overwatch.
# Start with:  docker compose up -d   (requires Docker Desktop running)
# Then set server/.env DATABASE_URL to the value in server/.env.example.
services:
  db:
    image: postgres:16-alpine
    container_name: overwatch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: overwatch
      POSTGRES_PASSWORD: overwatch
      POSTGRES_DB: overwatch
    ports:
      - "5432:5432"
    volumes:
      - overwatch-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U overwatch -d overwatch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  overwatch-db-data:
