# Serves the SPA and reverse-proxies the API so the browser talks to one origin.
# This file is an nginx TEMPLATE: ${API_UPSTREAM} is filled by envsubst at container start
# (see web/Dockerfile). Local/compose default is the `api` service; on Azure Container Apps set
# API_UPSTREAM to the API app's internal FQDN, e.g. https://overwatch-api.internal.<env>.<region>.azurecontainerapps.io
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compress text assets AND proxied API JSON. The dashboard's larger responses (bundle ~400KB, some
  # API payloads >200KB) travel far better compressed — this matters most for the cross-region hop to
  # the API and for first-load of the SPA. gzip_proxied=any so responses proxied from the API are
  # compressed too; gzip_vary so caches key on Accept-Encoding.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

  # Hashed build assets are content-addressed (their name changes when content changes), so they are
  # safe to cache forever — repeat visits and navigations load them from disk instead of the network.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Client-side routes fall back to the SPA entry.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API + health → the API. Raw bodies pass through unchanged (needed for HMAC webhooks).
  # Host is the upstream host + SNI is enabled so an HTTPS internal FQDN (Container Apps) routes correctly;
  # both are harmless for the plain-HTTP compose upstream.
  location /api/ {
    proxy_pass ${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Demo-control ops (seed / process) do many cross-region DB writes and can run well past nginx's
    # 60s default — wait for them instead of returning a premature 504.
    proxy_connect_timeout 75s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }
  location = /health {
    proxy_pass ${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host $proxy_host;
  }
}
