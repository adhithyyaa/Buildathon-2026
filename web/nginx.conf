# Serves the SPA and reverse-proxies the API so the browser talks to one origin.
# On docker-compose the upstream is the `api` service; on Azure Container Apps, replace
# http://api:8787 with the API container app's internal FQDN (see docs/DEPLOY.md).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Client-side routes fall back to the SPA entry.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API + health → the API service. Raw bodies pass through unchanged (needed for HMAC webhooks).
  location /api/ {
    proxy_pass http://api:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /health {
    proxy_pass http://api:8787;
    proxy_set_header Host $host;
  }
}
