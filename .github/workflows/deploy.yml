name: Deploy

# Every push to main rebuilds both images in ACR (tagged with the commit) and swaps them onto the
# running apps. Config lives in "Azure setup" (step=configure); infra is created by "Azure setup"
# (step=provision). This workflow only ever changes the image.

on:
  push:
    branches: [main]
    paths-ignore:      # doc-only changes shouldn't trigger a full image rebuild/redeploy
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

env:
  RESOURCE_GROUP: overwatch-rg
  API_APP: overwatch-api
  WEB_APP: overwatch-web
  ML_APP: overwatch-ml
  ACR_NAME: ${{ vars.ACR_NAME }}

jobs:
  # Skip (not fail) until the service principal + registry name are configured, so pushes stay green.
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        run: echo "ready=${{ secrets.AZURE_CREDENTIALS != '' && vars.ACR_NAME != '' }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can diff which components changed

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install the Container Apps extension
        run: az extension add --name containerapp --upgrade --allow-preview true

      - name: Decide which images changed
        id: what
        run: |
          if [ "${{ github.event_name }}" != "push" ] || ! git rev-parse "${{ github.event.before }}^{commit}" >/dev/null 2>&1; then
            echo "manual run or unknown base — building all"
            { echo "api=true"; echo "web=true"; echo "ml=true"; } >> "$GITHUB_OUTPUT"; exit 0
          fi
          DIFF=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          echo "changed files:"; echo "$DIFF"
          api=false; web=false; ml=false
          if grep -qE '^server/' <<<"$DIFF"; then api=true; fi
          if grep -qE '^ml/[A-Za-z0-9_]+\.json$' <<<"$DIFF"; then api=true; fi   # API bundles the ml/*.json reports
          if grep -qE '^web/' <<<"$DIFF"; then web=true; fi
          if grep -qE '^ml/(src/|Dockerfile|requirements\.txt)' <<<"$DIFF"; then ml=true; fi
          echo "build -> api=$api web=$web ml=$ml"
          { echo "api=$api"; echo "web=$web"; echo "ml=$ml"; } >> "$GITHUB_OUTPUT"

      - name: Build and push changed images (runner build)
        # ACR Tasks (az acr build) is blocked on this subscription, so build on the runner and push.
        # Only changed components rebuild — the ML image trains at build and is slow.
        run: |
          ACR_LOGIN=$(az acr show -n "$ACR_NAME" --query loginServer -o tsv)
          ACR_USER=$(az acr credential show -n "$ACR_NAME" --query username -o tsv)
          ACR_PASS=$(az acr credential show -n "$ACR_NAME" --query 'passwords[0].value' -o tsv)
          echo "::add-mask::$ACR_PASS"
          echo "$ACR_PASS" | docker login "$ACR_LOGIN" -u "$ACR_USER" --password-stdin
          if [ "${{ steps.what.outputs.api }}" = "true" ]; then
            docker build -t "$ACR_LOGIN/overwatch-api:${{ github.sha }}" -f server/Dockerfile .
            docker push "$ACR_LOGIN/overwatch-api:${{ github.sha }}"
          else echo "api unchanged — skip build"; fi
          if [ "${{ steps.what.outputs.web }}" = "true" ]; then
            docker build -t "$ACR_LOGIN/overwatch-web:${{ github.sha }}" \
              --build-arg VITE_GOOGLE_CLIENT_ID="${{ vars.APP_GOOGLE_CLIENT_ID }}" ./web
            docker push "$ACR_LOGIN/overwatch-web:${{ github.sha }}"
          else echo "web unchanged — skip build"; fi
          if [ "${{ steps.what.outputs.ml }}" = "true" ]; then
            docker build -t "$ACR_LOGIN/overwatch-ml:${{ github.sha }}" ./ml
            docker push "$ACR_LOGIN/overwatch-ml:${{ github.sha }}"
          else echo "ml unchanged — skip build"; fi
          echo "ACR_LOGIN=$ACR_LOGIN" >> "$GITHUB_ENV"

      - name: Swap the changed images onto the apps
        run: |
          swap() {
            local NAME=$1 IMG=$2
            if az containerapp show -n "$NAME" -g "$RESOURCE_GROUP" >/dev/null 2>&1; then
              az containerapp update -g "$RESOURCE_GROUP" -n "$NAME" --image "$IMG" --output none
              echo "rolled $NAME"
            else
              echo "$NAME not provisioned yet — skipping (run Azure setup -> provision first)"
            fi
          }
          if [ "${{ steps.what.outputs.api }}" = "true" ]; then swap "$API_APP" "$ACR_LOGIN/overwatch-api:${{ github.sha }}"; fi
          if [ "${{ steps.what.outputs.web }}" = "true" ]; then swap "$WEB_APP" "$ACR_LOGIN/overwatch-web:${{ github.sha }}"; fi
          if [ "${{ steps.what.outputs.ml }}" = "true" ]; then swap "$ML_APP" "$ACR_LOGIN/overwatch-ml:${{ github.sha }}"; fi

      - name: Report
        run: |
          WEB_FQDN=$(az containerapp show -g "$RESOURCE_GROUP" -n "$WEB_APP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "Deployed ${GITHUB_SHA} to https://$WEB_FQDN" >> "$GITHUB_STEP_SUMMARY"
