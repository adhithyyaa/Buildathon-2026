name: Deploy

# Every push to main rebuilds both images in ACR (tagged with the commit) and swaps them onto the
# running apps. It does nothing else: the apps' configuration is owned by the "Azure setup" workflow
# (step=configure), and a push cannot change it. Infra is created once by "Azure setup" (step=provision).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write        # OIDC — no stored Azure key

env:
  RESOURCE_GROUP: overwatch-rg
  API_APP: overwatch-api
  WEB_APP: overwatch-web
  ACR_NAME: ${{ vars.ACR_NAME }}

jobs:
  # Skip (not fail) until OIDC + the registry name are configured, so pushes before setup stay green.
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        run: echo "ready=${{ secrets.AZURE_CLIENT_ID != '' && vars.ACR_NAME != '' }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install the Container Apps extension
        run: az extension add --name containerapp --upgrade --allow-preview true

      - name: Resolve ACR login server
        run: echo "ACR_LOGIN=$(az acr show -n "$ACR_NAME" --query loginServer -o tsv)" >> "$GITHUB_ENV"

      - name: Build both images in ACR (tagged with the commit)
        run: |
          az acr build -r "$ACR_NAME" -t overwatch-api:${{ github.sha }} -f server/Dockerfile .
          az acr build -r "$ACR_NAME" -t overwatch-web:${{ github.sha }} ./web

      - name: Swap the new images onto the apps
        run: |
          az containerapp update -g "$RESOURCE_GROUP" -n "$API_APP" \
            --image "$ACR_LOGIN/overwatch-api:${{ github.sha }}" --output none
          az containerapp update -g "$RESOURCE_GROUP" -n "$WEB_APP" \
            --image "$ACR_LOGIN/overwatch-web:${{ github.sha }}" --output none

      - name: Report
        run: |
          WEB_FQDN=$(az containerapp show -g "$RESOURCE_GROUP" -n "$WEB_APP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "Deployed \`${GITHUB_SHA::7}\` → https://$WEB_FQDN" >> "$GITHUB_STEP_SUMMARY"
