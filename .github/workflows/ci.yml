name: CI

on:
  push:
  pull_request:

jobs:
  server:
    name: server · typecheck + policy tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run test # policy property tests — pure functions, no DB / no keys

  web:
    name: web · typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  ml:
    name: ml · train + counterfactual eval (seeded)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ml/requirements.txt
      - name: world A — train + counterfactual eval
        run: |
          python ml/src/worldmodel.py --out ml/data/train.csv
          python ml/src/train.py --data ml/data/train.csv --out ml/artifacts
          python ml/src/eval.py --data ml/data/train.csv --art ml/artifacts --out ml/eval.json
      - name: world B — independent context-driven world (robustness)
        run: |
          python ml/src/worldmodel2.py --out ml/data/train_v2.csv
          python ml/src/train.py --data ml/data/train_v2.csv --out ml/artifacts_v2
          python ml/src/eval.py --world v2 --data ml/data/train_v2.csv --art ml/artifacts_v2 --out ml/eval_v2.json
      - name: cross-world transfer — frozen A<->B models (inference-only, no retraining)
        run: python ml/src/transfer.py --out ml/transfer.json
      - uses: actions/upload-artifact@v4
        with:
          name: ml-metrics
          path: |
            ml/metrics.json
            ml/eval.json
            ml/eval_v2.json
            ml/transfer.json
