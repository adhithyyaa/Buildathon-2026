name: Azure setup

# One-time infra, and the place configuration lives. Auth is a service principal (AZURE_CREDENTIALS).
#   provision  — create the registry, Container Apps environment, and both apps (placeholder image).
#   configure  — (re)apply environment variables and link the two apps.
# Recommended first-run order: provision -> configure -> Deploy. Configuring before the first deploy
# means the real API image starts already holding DATABASE_URL, so it never fails a health check.

on:
  workflow_dispatch:
    inputs:
      step:
        description: What to run
        required: true
        type: choice
        options: [provision, configure]

permissions:
  contents: read

env:
  RESOURCE_GROUP: overwatch-rg
  # This subscription (Azure for Students) allows only ONE Container Apps environment total — already used
  # by another live project — so Overwatch SHARES that environment: its two apps join it while the other
  # project's apps stay untouched (each app scales/bills independently). ACA_ENV_ID is that environment's
  # full resource id (a repo Variable); the CI principal is granted access to it. Overwatch's own resources
  # (registry, the two apps) still live in overwatch-rg.
  ACA_ENV_ID: ${{ vars.ACA_ENV_ID }}
  API_APP: overwatch-api
  WEB_APP: overwatch-web
  ML_APP: overwatch-ml
  API_PORT: '8787'
  WEB_PORT: '80'
  ML_PORT: '8899'
  ACR_NAME: ${{ vars.ACR_NAME }}

jobs:
  provision:
    if: ${{ github.event.inputs.step == 'provision' }}
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install the Container Apps extension
        run: az extension add --name containerapp --upgrade --allow-preview true

      - name: Registry
        run: |
          if az acr show -n "$ACR_NAME" -g "$RESOURCE_GROUP" >/dev/null 2>&1; then
            echo "registry $ACR_NAME already exists"
          else
            az acr create -g "$RESOURCE_GROUP" -n "$ACR_NAME" --sku Basic --admin-enabled true --output none
            echo "created $ACR_NAME"
          fi

      - name: Create the apps
        run: |
          ACR_PASSWORD=$(az acr credential show -n "$ACR_NAME" --query "passwords[0].value" -o tsv)
          echo "::add-mask::$ACR_PASSWORD"
          create() {
            local NAME=$1 PORT=$2 INGRESS=$3 MIN=$4 MAX=$5 CPU=$6 MEM=$7
            if az containerapp show -n "$NAME" -g "$RESOURCE_GROUP" >/dev/null 2>&1; then
              echo "$NAME already exists"; return
            fi
            az containerapp create \
              -n "$NAME" -g "$RESOURCE_GROUP" --environment "$ACA_ENV_ID" \
              --image mcr.microsoft.com/k8se/quickstart:latest \
              --target-port "$PORT" --ingress "$INGRESS" \
              --cpu "$CPU" --memory "$MEM" --min-replicas "$MIN" --max-replicas "$MAX" \
              --registry-server "$ACR_NAME.azurecr.io" \
              --registry-username "$ACR_NAME" --registry-password "$ACR_PASSWORD" \
              --output none
            echo "created $NAME"
          }
          # API: internal ingress, one replica kept warm (retry scheduler + no cold-start on webhooks).
          create "$API_APP" "$API_PORT" internal 1 1 0.25 0.5Gi
          # Web: public nginx SPA that proxies /api to the API; scales to zero when idle.
          create "$WEB_APP" "$WEB_PORT" external 0 2 0.25 0.5Gi
          # ML: Python/CatBoost inference, internal ingress, scale-to-zero (heavier box for model load;
          # cold-starts on first prediction, ~free while idle). The API falls back to deterministic
          # scoring whenever it is down, so this is purely an upgrade.
          create "$ML_APP" "$ML_PORT" internal 0 1 1.0 2.0Gi

      - name: Report
        run: |
          echo "Provisioned — next run step=configure, then Deploy (or push)." >> "$GITHUB_STEP_SUMMARY"

  configure:
    if: ${{ github.event.inputs.step == 'configure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install the Container Apps extension
        run: az extension add --name containerapp --upgrade --allow-preview true

      - name: Resolve both URLs
        run: |
          API_FQDN=$(az containerapp show -n "$API_APP" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          WEB_FQDN=$(az containerapp show -n "$WEB_APP" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          ML_FQDN=$(az containerapp show -n "$ML_APP" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "API_FQDN=$API_FQDN" >> "$GITHUB_ENV"
          echo "WEB_URL=https://$WEB_FQDN" >> "$GITHUB_ENV"
          echo "ML_URL=https://$ML_FQDN" >> "$GITHUB_ENV"

      - name: Configure the API
        env:
          DATABASE_URL: ${{ secrets.APP_DATABASE_URL }}
          RAZORPAY_KEY_ID: ${{ secrets.APP_RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.APP_RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.APP_RAZORPAY_WEBHOOK_SECRET }}
          OPENAI_API_KEY: ${{ secrets.APP_OPENAI_API_KEY }}
        run: |
          az containerapp secret set -n "$API_APP" -g "$RESOURCE_GROUP" --secrets \
            db-url="$DATABASE_URL" \
            rzp-secret="$RAZORPAY_KEY_SECRET" \
            wh-secret="$RAZORPAY_WEBHOOK_SECRET" \
            openai-key="$OPENAI_API_KEY" \
            --output none
          az containerapp update -n "$API_APP" -g "$RESOURCE_GROUP" \
            --set-env-vars \
              NODE_ENV=production \
              OPEN_OPERATOR_ENDPOINTS=true \
              PORT="$API_PORT" \
              WEB_ORIGIN="$WEB_URL" \
              PUBLIC_BASE_URL="$WEB_URL" \
              ML_SERVICE_URL="$ML_URL" \
              ML_TIMEOUT_MS=45000 \
              DATABASE_URL=secretref:db-url \
              RAZORPAY_KEY_ID="$RAZORPAY_KEY_ID" \
              RAZORPAY_KEY_SECRET=secretref:rzp-secret \
              RAZORPAY_WEBHOOK_SECRET=secretref:wh-secret \
              OPENAI_API_KEY=secretref:openai-key \
              OPENAI_BASE_URL=https://api.groq.com/openai/v1 \
              OPENAI_MODEL=openai/gpt-oss-120b \
            --output none

      - name: Configure the web app
        run: |
          az containerapp update -n "$WEB_APP" -g "$RESOURCE_GROUP" \
            --set-env-vars API_UPSTREAM="https://$API_FQDN" \
            --output none

      - name: Report
        run: |
          {
            echo "### Live"
            echo ""
            echo "- Dashboard: $WEB_URL"
            echo "- Webhook:   $WEB_URL/api/webhooks/razorpay"
          } >> "$GITHUB_STEP_SUMMARY"
